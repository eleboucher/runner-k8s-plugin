---
name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  goreleaser:
    runs-on: docker
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        run: curl -sfL https://goreleaser.com/static/run | VERSION=v2.16.0 bash -s -- release --clean
        env:
          GORELEASER_FORCE_TOKEN: gitea
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEA_SERVER_URL: https://git.erwanleboucher.dev

  container:
    runs-on: multiarch
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7

      - uses: https://data.forgejo.org/docker/setup-buildx-action@v4

      - name: Compute build timestamp
        id: build-meta
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Login to code.forgejo.org
        uses: https://data.forgejo.org/docker/login-action@v4
        with:
          registry: code.forgejo.org
          username: ${{ vars.USERNAME }}
          password: ${{ secrets.CODEBERG_TOKEN }}

      - name: Login to git.erwanleboucher.dev
        uses: https://data.forgejo.org/docker/login-action@v4
        with:
          registry: git.erwanleboucher.dev
          username: ${{ vars.USERNAME }}
          password: ${{ secrets.OWNER_PACKAGE_SECRET }}

      - name: Login to registry.erwanleboucher.dev
        uses: https://data.forgejo.org/docker/login-action@v4
        with:
          registry: registry.erwanleboucher.dev
          username: ${{ vars.USERNAME }}
          password: ${{ secrets.APOCI_REGISTRY_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: https://data.forgejo.org/docker/metadata-action@v6
        with:
          images: |
            code.forgejo.org/${{ vars.USERNAME }}/runner-k8s-plugin
            git.erwanleboucher.dev/${{ vars.USERNAME }}/runner-k8s-plugin
            registry.erwanleboucher.dev/${{ vars.USERNAME }}/runner-k8s-plugin
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=runner-k8s-plugin
            org.opencontainers.image.description=Forgejo Runner backend plugin that executes CI/CD jobs as Kubernetes pods
            org.opencontainers.image.documentation=https://git.erwanleboucher.dev/eleboucher/runner-k8s-plugin/src/branch/main/README.md
            org.opencontainers.image.authors=Erwan Leboucher <erwanleboucher@gmail.com>
            org.opencontainers.image.vendor=Erwan Leboucher

      - name: Build and push
        uses: https://data.forgejo.org/docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.build-meta.outputs.created }}

  chart:
    runs-on: docker
    needs: container
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7

      - name: Install Helm
        run: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Resolve version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to git.erwanleboucher.dev
        run: helm registry login git.erwanleboucher.dev -u "${{ vars.USERNAME }}" -p "${{ secrets.OWNER_PACKAGE_SECRET }}"

      - name: Package chart
        run: |
          helm package charts/forgejo-runner \
            --version "${{ steps.version.outputs.version }}" \
            --app-version "${{ steps.version.outputs.version }}"

      - name: Push chart
        id: push
        run: |
          out=$(helm push "forgejo-runner-${{ steps.version.outputs.version }}.tgz" \
            oci://git.erwanleboucher.dev/${{ vars.USERNAME }}/charts 2>&1)
          echo "$out"
          echo "digest=$(echo "$out" | awk '/Digest:/ {print $2}')" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        run: |
          curl -fsSL -o /usr/local/bin/cosign \
            https://github.com/sigstore/cosign/releases/download/v3.1.1/cosign-linux-amd64
          chmod +x /usr/local/bin/cosign

      - name: Sign chart
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          cosign login git.erwanleboucher.dev -u "${{ vars.USERNAME }}" -p "${{ secrets.OWNER_PACKAGE_SECRET }}"
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY \
            "git.erwanleboucher.dev/${{ vars.USERNAME }}/charts/forgejo-runner@${{ steps.push.outputs.digest }}"
